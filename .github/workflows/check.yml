name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Parse Windows keystore wizard
        shell: pwsh
        run: |
          $syntaxErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/create-keeper-keystore.ps1'), [ref]$null, [ref]$syntaxErrors) | Out-Null
          if ($syntaxErrors) { throw ($syntaxErrors | Out-String) }
      - run: bash -n ops/prepare-ubuntu.sh ops/configure-staging.sh ops/configure-netlify.sh
      - run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/host-preflight.py').read_text())"
      - run: npm run build:netlify
      - run: npm test
      - run: python3 -m unittest discover -s test-support -p test_keeper_password.py
      - run: npm run build:runtime
      - run: node scripts/check-runtime.mjs dist/runtime
      - run: npm run --silent audit:security
